<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACCE - Login</title>
<style>
:root{
  --blue:#1f5fd2;
  --blue2:#5f9bea;
  --ink:#151515;
  --panel:rgba(220,231,250,.86);
  --line:#d8e1ef;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Segoe UI','Arial',sans-serif;color:var(--ink);background:#fff}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    linear-gradient(135deg,transparent 0 15%,rgba(221,229,242,.55) 15% 28%,transparent 28% 50%,rgba(226,234,247,.55) 50% 65%,transparent 65%),
    linear-gradient(45deg,transparent 0 60%,rgba(111,181,234,.68) 60% 75%,transparent 75%),
    #fff;
}
.app{width:100%;max-width:100%;margin:0;min-height:100vh;padding:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:24px 60px;background:transparent}
.logo{font-size:48px;font-weight:900;letter-spacing:-3px;color:#155bd1}
.lang-area{position:relative;display:flex;align-items:center;gap:20px}
.lang-btn{
  width:64px;height:64px;border:0;background:transparent;border-radius:50%;
  font-size:48px;cursor:pointer;padding:0;
}
.refresh{font-size:44px;font-weight:700;line-height:1;transform:rotate(-20deg);opacity:.95}
.country-menu{
  position:absolute;right:0;top:74px;width:300px;max-height:60vh;overflow:auto;
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.16);padding:10px;display:none;z-index:20
}
.country-menu.open{display:block}
.country-option{
  width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;
  border:0;background:#fff;border-radius:12px;cursor:pointer;font-size:17px;text-align:left
}
.country-option:hover{background:#eef5ff}
.flag{font-size:32px;width:44px;text-align:center}
.country-name{flex:1}
.country-ar{font-size:14px;color:#777;display:block;margin-top:2px}
.container{flex:1;display:flex;align-items:center;justify-content:center;padding:0 60px}
.content{width:100%;max-width:750px}
.heading{font-size:64px;font-weight:800;margin:0 0 40px;text-align:left;color:#000}
.panel{
  background:var(--panel);border-radius:32px;padding:40px 44px;
  border:1px solid rgba(200,215,238,.7);margin-bottom:28px
}
.label{font-size:28px;font-weight:700;margin:0 0 14px;text-align:left}
.field{
  height:80px;background:#fff;border:1px solid #eef2f7;border-radius:8px;
  display:flex;align-items:center;padding:0 20px;margin-bottom:32px
}
.phone-code{
  display:flex;align-items:center;gap:10px;font-size:28px;white-space:nowrap;
  border:0;background:transparent;cursor:pointer;padding:0 16px 0 0
}
.code-arrow{font-size:24px}
.phone-input,.text-input{
  flex:1;border:0;outline:0;background:transparent;font-size:28px;min-width:0;
  color:#222;text-align:left
}
.phone-input::placeholder,.text-input::placeholder{color:#aaa}
.password-field{padding-right:20px}
.eye{
  width:44px;height:44px;border:0;background:transparent;font-size:36px;cursor:pointer;
  padding:0;margin-left:12px;display:flex;align-items:center;justify-content:center
}
.remember-row{display:flex;align-items:center;gap:16px;color:#155bd1;font-size:26px;font-weight:700;justify-content:flex-start}
.switch{position:relative;width:80px;height:48px;background:#999;border-radius:32px;cursor:pointer;border:none}
.switch i{position:absolute;width:40px;height:40px;right:4px;top:4px;background:#fff;border-radius:50%;transition:.18s}
.switch.on{background:#1f5fd2}.switch.on i{right:auto;left:4px}
.main-btn{
  width:100%;height:86px;margin-top:48px;border:0;border-radius:44px;
  background:linear-gradient(90deg,#71a8ee,#76a7eb);color:#fff;font-size:30px;cursor:pointer;font-weight:700;font-family:'Segoe UI','Arial',sans-serif
}
.main-btn:active{background:linear-gradient(90deg,#2f78df,#5d98e8)}
.member{font-size:26px;text-align:center;margin-top:28px}
.member a{color:#155bd1;text-decoration:none;font-weight:600;cursor:pointer}
.version{text-align:center;font-size:20px;margin-top:40px;color:#666;padding-bottom:20px}
.error{color:#d51616;font-size:18px;margin:-18px 0 16px;font-weight:700;min-height:20px;text-align:left}
.notice{color:#d51616;font-size:20px;font-weight:700;text-align:center;margin-top:16px;min-height:24px}
.register-panel{padding-bottom:24px}
.register-title{font-size:60px;font-weight:800;margin:0 0 36px;text-align:left}
.invite-note{font-size:16px;color:#666;margin-top:-18px;margin-bottom:22px;text-align:left}
.agree{display:flex;align-items:flex-start;gap:14px;font-size:20px;line-height:1.5;margin-top:8px;flex-direction:row}
.agree input{width:28px;height:28px;margin-top:4px;accent-color:#2f78df;cursor:pointer}
.agree a{color:#155bd1;text-decoration:none}
.hidden{display:none!important}
.country-code-menu{
  position:absolute;right:0;top:74px;width:280px;max-height:55vh;overflow:auto;background:#fff;
  border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.14);
  display:none;z-index:25;padding:8px
}
.country-code-menu.open{display:block}
.code-option{
  width:100%;border:0;background:#fff;text-align:center;padding:12px;border-radius:10px;
  font-size:18px;cursor:pointer;font-weight:500
}
.code-option:hover{background:#eef5ff}
.captcha-display{
  font-size:44px;font-weight:bold;letter-spacing:12px;color:#333;text-align:center;
  padding:14px 0;margin-bottom:10px
}
.captcha-display span:nth-child(1){color:#FFD700}
.captcha-display span:nth-child(2){color:#00AA00}
.captcha-display span:nth-child(3){color:#0000FF}
.captcha-display span:nth-child(4){color:#9933FF}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">ACCE</div>
    <div class="lang-area">
      <button id="langBtn" class="lang-btn" aria-label="Language">🇬🇧</button>
      <div class="refresh">↻</div>
      <div id="countryMenu" class="country-menu"></div>
    </div>
  </div>

  <div class="container">
    <div class="content">
      <section id="loginPage">
        <h1 id="loginTitle" class="heading">Log in</h1>
        <div class="panel">
          <p id="phoneLabel" class="label">Phone number</p>
          <div class="field" style="position:relative">
            <input id="phone" class="phone-input" inputmode="numeric" autocomplete="tel" placeholder="Phone number" maxlength="11">
            <button id="codeBtn" class="phone-code" type="button"><span id="codeText">+964</span> <span class="code-arrow">⌄</span></button>
            <div id="codeMenu" class="country-code-menu"></div>
          </div>
          <div id="phoneError" class="error"></div>

          <p id="passwordLabel" class="label">Password</p>
          <div class="field password-field">
            <input id="password" class="text-input" type="password" autocomplete="current-password" placeholder="password" maxlength="8">
            <button id="eye" class="eye" type="button" aria-label="Show password">◉</button>
          </div>
          <div id="passwordError" class="error"></div>

          <div class="remember-row">
            <button id="switch" class="switch" type="button" aria-label="Remember password"><i></i></button>
            <span id="rememberText">Remember password</span>
          </div>
        </div>

        <button id="loginBtn" class="main-btn" type="button">Log in</button>
        <div id="loginNotice" class="notice"></div>
        <div class="member"><span id="notMember">Not A Member?</span> <a id="registerLink">Register Now</a></div>
        <div class="version">version number: 1.0.3.1</div>
      </section>

      <section id="registerPage" class="hidden">
        <h1 id="registerTitle" class="register-title">User Registration</h1>
        <div class="panel register-panel">
          <p id="rPhoneLabel" class="label">Phone number</p>
          <div class="field" style="position:relative">
            <input id="rPhone" class="phone-input" inputmode="numeric" autocomplete="tel" placeholder="Phone number" maxlength="11">
            <button id="rCodeBtn" class="phone-code" type="button"><span id="rCodeText">+964</span> <span class="code-arrow">⌄</span></button>
            <div id="rCodeMenu" class="country-code-menu"></div>
          </div>
          <div id="rPhoneError" class="error"></div>

          <p id="rPasswordLabel" class="label">Password</p>
          <div class="field password-field">
            <input id="rPassword" class="text-input" type="password" placeholder="Enter password" maxlength="8">
            <button id="rEye" class="eye" type="button">◉</button>
          </div>
          <div id="rPasswordError" class="error"></div>

          <p id="confirmLabel" class="label">Confirm Password</p>
          <div class="field password-field">
            <input id="rConfirm" class="text-input" type="password" placeholder="Please confirm password" maxlength="8">
            <button id="rConfirmEye" class="eye" type="button">◉</button>
          </div>
          <div id="rConfirmError" class="error"></div>

          <p id="captchaLabel" class="label">Official Captcha</p>
          <div class="field" style="flex-direction:column;height:auto;padding:16px 20px;justify-content:center;gap:10px">
            <div class="captcha-display">
              <span>F</span><span>J</span><span>1</span><span>8</span>
            </div>
            <input id="captcha" class="text-input" placeholder="Enter verification code: FJ18" maxlength="4" style="text-align:center;font-size:26px">
          </div>
          <div id="captchaError" class="error"></div>

          <p id="inviteLabel" class="label">Invite Code</p>
          <div class="field">
            <input id="invite" class="text-input" placeholder="Please enter invite code" maxlength="3">
          </div>
          <div class="invite-note">Invite Code: 3 characters</div>
          <div id="inviteError" class="error"></div>

          <label class="agree">
            <input id="agree" type="checkbox">
            <span><a href="#" onclick="return false">Enrollment Agreement</a></span>
          </label>
        </div>

        <button id="registerBtn" class="main-btn" type="button">Register Now</button>
        <div id="registerNotice" class="notice"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  const HOME = 'index.html';
  const AUTH_KEY = 'acce_login_data_v1';

  const countries = [
    {flag:'🇬🇧', name:'United Kingdom', code:'+44', lang:'en'},
    {flag:'🇺🇸', name:'United States', code:'+1', lang:'en'},
    {flag:'🇦🇺', name:'Australia', code:'+61', lang:'en'},
    {flag:'🇨🇦', name:'Canada', code:'+1', lang:'en'},
    {flag:'🇩🇪', name:'Germany', code:'+49', lang:'en'},
    {flag:'🇫🇷', name:'France', code:'+33', lang:'en'},
    {flag:'🇮🇹', name:'Italy', code:'+39', lang:'en'},
    {flag:'🇪🇸', name:'Spain', code:'+34', lang:'en'},
    {flag:'🇹🇷', name:'Turkey', code:'+90', lang:'en'},
    {flag:'🇦🇪', name:'United Arab Emirates', code:'+971', lang:'en'},
    {flag:'🇮🇶', name:'Iraq', code:'+964', lang:'en'},
    {flag:'🇸🇦', name:'Saudi Arabia', code:'+966', lang:'en'},
    {flag:'🇶🇦', name:'Qatar', code:'+974', lang:'en'},
    {flag:'🇰🇼', name:'Kuwait', code:'+965', lang:'en'}
  ];

  let selected = countries[0];
  let selectedCode = '+44';
  let remembered = false;

  const $ = id => document.getElementById(id);
  const countryMenu = $('countryMenu');
  const codeMenu = $('codeMenu');
  const rCodeMenu = $('rCodeMenu');

  function renderCountries(){
    countryMenu.innerHTML = countries.map((c,i)=>`
      <button class="country-option" type="button" data-i="${i}">
        <span class="flag">${c.flag}</span>
        <span class="country-name">${c.name}</span>
      </button>`).join('');
    countryMenu.querySelectorAll('.country-option').forEach(b=>{
      b.onclick=()=>{ selectCountry(+b.dataset.i); countryMenu.classList.remove('open'); };
    });
  }

  function renderCodes(menu, setter){
    menu.innerHTML = countries.map(c=>`
      <button class="code-option" type="button" data-code="${c.code}">${c.code}</button>`).join('');
    menu.querySelectorAll('.code-option').forEach(b=>{
      b.onclick=()=>{ setter(b.dataset.code); menu.classList.remove('open'); };
    });
  }

  function selectCountry(i){
    selected = countries[i];
    $('langBtn').textContent = selected.flag;
    document.documentElement.lang = selected.lang;
    selectedCode = selected.code;
    $('codeText').textContent = selected.code;
    $('rCodeText').textContent = selected.code;
  }

  function validatePhone(v){
    return /^\d{11}$/.test(v);
  }
  function validatePassword(v){
    return /^[A-Za-z0-9]{8}$/.test(v);
  }
  function setError(id,msg){ $(id).textContent=msg||''; }

  $('langBtn').onclick=()=>countryMenu.classList.toggle('open');
  document.addEventListener('click',e=>{
    if(!e.target.closest('.lang-area')) countryMenu.classList.remove('open');
    if(!e.target.closest('#codeBtn') && !e.target.closest('#codeMenu')) codeMenu.classList.remove('open');
    if(!e.target.closest('#rCodeBtn') && !e.target.closest('#rCodeMenu')) rCodeMenu.classList.remove('open');
  });

  $('codeBtn').onclick=e=>{e.stopPropagation();codeMenu.classList.toggle('open')};
  $('rCodeBtn').onclick=e=>{e.stopPropagation();rCodeMenu.classList.toggle('open')};
  renderCodes(codeMenu,c=>{$('codeText').textContent=c;selectedCode=c});
  renderCodes(rCodeMenu,c=>{$('rCodeText').textContent=c});
  renderCountries();

  $('switch').onclick=()=>{ remembered=!remembered; $('switch').classList.toggle('on',remembered); };

  function eye(btn,input){
    btn.onclick=()=>{input.type=input.type==='password'?'text':'password'};
  }
  eye($('eye'),$('password'));
  eye($('rEye'),$('rPassword'));
  eye($('rConfirmEye'),$('rConfirm'));

  $('registerLink').onclick=()=>{
    $('loginPage').classList.add('hidden'); 
    $('registerPage').classList.remove('hidden'); 
    window.scrollTo(0,0);
  };

  $('loginBtn').onclick=()=>{
    setError('phoneError',''); setError('passwordError',''); $('loginNotice').textContent='';
    const phone=$('phone').value.trim(), pass=$('password').value;
    let ok=true;
    if(!validatePhone(phone)){
      setError('phoneError','Invalid phone number'); ok=false;
    }
    if(!validatePassword(pass)){
      setError('passwordError','Password must be 8 characters'); ok=false;
    }
    if(!ok) return;

    const saved=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');
    if(saved && saved.code===selectedCode && saved.phone===phone && saved.password===pass){
      if(remembered) localStorage.setItem(AUTH_KEY,JSON.stringify(saved));
      window.location.href=HOME;
    }else{
      $('loginNotice').textContent='You do not have an ACCE account';
    }
  };

  $('registerBtn').onclick=()=>{
    ['rPhoneError','rPasswordError','rConfirmError','captchaError','inviteError'].forEach(id=>setError(id,''));
    $('registerNotice').textContent='';
    const phone=$('rPhone').value.trim();
    const pass=$('rPassword').value;
    const conf=$('rConfirm').value;
    const captcha=$('captcha').value.trim().toUpperCase();
    const invite=$('invite').value.trim();
    let ok=true;

    if(!validatePhone(phone)){
      setError('rPhoneError','Invalid phone number'); ok=false;
    }
    if(!validatePassword(pass)){ setError('rPasswordError','Password must be 8 characters'); ok=false; }
    if(conf!==pass){ setError('rConfirmError','Passwords do not match'); ok=false; }
    if(captcha!=='FJ18'){ setError('captchaError','Invalid captcha'); ok=false; }
    if(!/^[A-Za-z0-9]{3}$/.test(invite)){ setError('inviteError','Invite code must be 3 characters'); ok=false; }
    if(!$('agree').checked){ $('registerNotice').textContent='Please accept the enrollment agreement'; ok=false; }
    if(!ok) return;

    const data={code:$('rCodeText').textContent,phone,password:pass,invite,remembered:true};
    localStorage.setItem(AUTH_KEY,JSON.stringify(data));
    window.location.href=HOME;
  };

  $('phone').addEventListener('input',()=>{$('phone').value=$('phone').value.replace(/\D/g,'').slice(0,11)});
  $('rPhone').addEventListener('input',()=>{$('rPhone').value=$('rPhone').value.replace(/\D/g,'').slice(0,11)});
  $('password').addEventListener('input',()=>{$('password').value=$('password').value.replace(/[^A-Za-z0-9]/g,'').slice(0,8)});
  $('rPassword').addEventListener('input',()=>{$('rPassword').value=$('rPassword').value.replace(/[^A-Za-z0-9]/g,'').slice(0,8)});
  $('rConfirm').addEventListener('input',()=>{$('rConfirm').value=$('rConfirm').value.replace(/[^A-Za-z0-9]/g,'').slice(0,8)});
  $('invite').addEventListener('input',()=>{$('invite').value=$('invite').value.slice(0,3)});
})();
</script>
</body>
</html>
